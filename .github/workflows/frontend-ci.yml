name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/phase-zero-react-stability-2026-11-13

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run React tests
        run: CI=true npm test -- --watch=false
      - name: Build frontend
        run: CI=true npm run build
